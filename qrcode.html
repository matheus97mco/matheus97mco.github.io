<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matheus Cunha - Links Profissionais</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fundo com gradiente suave */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .link-card {
            transition: all 0.3s ease;
        }
        
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Animação suave de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        .delay-100 { animation-delay: 0.1s; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; opacity: 0; }
        .delay-300 { animation-delay: 0.3s; opacity: 0; }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden mt-8 mb-8 animate-fade-in">
        
        <!-- Cabeçalho / Perfil -->
        <div class="flex flex-col items-center pt-10 pb-6 px-6 border-b border-gray-100">
            <!-- Avatar Placeholder (Você pode substituir o src pela URL da sua foto) -->
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg mb-4">
    <img src="docs/teste.jpg" alt="Sua Foto Profissional" class="w-full h-full object-cover">
</div>
            
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Matheus Cunha</h1>
            <p class="text-gray-500 mt-1 text-center text-sm font-medium">Profissional de Ti e Pós-graduando em Análise de Dados</p>
        </div>

        <!-- Lista de Links -->
        <div class="px-6 py-8 flex flex-col gap-4">
            
            <!-- Link: Portfólio -->
            <a href="https://matheus97mco.github.io/" target="_blank" rel="noopener noreferrer" 
               class="link-card animate-fade-in delay-100 flex items-center w-full p-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-colors group">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mr-4 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-globe text-xl"></i>
                </div>
                <div class="flex-grow">
                    <span class="block font-semibold text-lg">Meu Portfólio</span>
                    <span class="block text-indigo-200 text-xs mt-0.5">Projetos e experiências</span>
                </div>
                <i class="fa-solid fa-arrow-right opacity-50 group-hover:opacity-100 transition-opacity transform group-hover:translate-x-1"></i>
            </a>

            <!-- Link: LinkedIn -->
            <a href="https://www.linkedin.com/in/matheuscunhaol/" target="_blank" rel="noopener noreferrer" 
               class="link-card animate-fade-in delay-200 flex items-center w-full p-4 bg-[#0A66C2] text-white rounded-xl hover:bg-[#004182] transition-colors group">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mr-4 group-hover:scale-110 transition-transform">
                    <i class="fa-brands fa-linkedin-in text-xl"></i>
                </div>
                <div class="flex-grow">
                    <span class="block font-semibold text-lg">LinkedIn</span>
                    <span class="block text-blue-200 text-xs mt-0.5">Conexões profissionais</span>
                </div>
                <i class="fa-solid fa-arrow-right opacity-50 group-hover:opacity-100 transition-opacity transform group-hover:translate-x-1"></i>
            </a>

            <!-- Link: GitHub -->
            <a href="https://github.com/matheus97mco" target="_blank" rel="noopener noreferrer" 
               class="link-card animate-fade-in delay-300 flex items-center w-full p-4 bg-[#24292e] text-white rounded-xl hover:bg-black transition-colors group">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mr-4 group-hover:scale-110 transition-transform">
                    <i class="fa-brands fa-github text-xl"></i>
                </div>
                <div class="flex-grow">
                    <span class="block font-semibold text-lg">GitHub</span>
                    <span class="block text-gray-400 text-xs mt-0.5">Repositórios e código fonte</span>
                </div>
                <i class="fa-solid fa-arrow-right opacity-50 group-hover:opacity-100 transition-opacity transform group-hover:translate-x-1"></i>
            </a>
            
        </div>
        
        <!-- Rodapé -->
        <div class="bg-gray-50 py-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-400 font-medium">© 2026 Matheus Cunha</p>
        </div>
        
    </main>

    <div class="flex gap-4 mb-8 animate-fade-in delay-300">
        <button onclick="sharePage()" class="w-12 h-12 rounded-full bg-white text-gray-600 shadow-md hover:shadow-lg hover:text-indigo-600 transition-all flex items-center justify-center" aria-label="Compartilhar">
            <i class="fa-solid fa-share-nodes"></i>
        </button>
        <!-- Você pode adicionar mais botões secundários aqui se quiser (ex: email) -->
    </div>

    <script>
        // Função para compartilhar a página via API nativa (se disponível em mobile)
        function sharePage() {
            if (navigator.share) {
                navigator.share({
                    title: 'Matheus Cunha - Links',
                    text: 'Confira meu portfólio e perfis profissionais.',
                    url: window.location.href,
                })
                .catch((error) => console.log('Erro ao compartilhar', error));
            } else {
                // Fallback: copiar para área de transferência se a API não existir
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                
                // Mostrar feedback visual simples
                const btn = document.querySelector('button[aria-label="Compartilhar"]');
                const originalIcon = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i>';
                setTimeout(() => {
                    btn.innerHTML = originalIcon;
                }, 2000);
            }
        }
    </script>
</body>
</html>
